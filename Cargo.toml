[package]
name = "ropacker"
version = "0.1.0"
edition = "2021"
description = "Arma un lugar de Roblox (.rbxlx) desde carpetas de Luau y lo publica, reinicia servidores y corre Luau con Open Cloud"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.37"
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
ureq = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
